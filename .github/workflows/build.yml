name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: receipt-kakeibo-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # main に push されたら「最新版」リリースを作り直し、スマホから APK を直接ダウンロードできるようにする
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk receipt-kakeibo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest receipt-kakeibo.apk \
            --title "最新版 (ビルド #${{ github.run_number }})" \
            --notes "スマホでこのページを開き、receipt-kakeibo.apk をダウンロードしてインストールしてください。" \
            --target "${{ github.sha }}"
